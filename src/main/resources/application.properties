Aspring.application.name=product-service

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=product-group
spring.kafka.consumer.auto-offset-reset=earliest


logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=WARN

# Set sampling to 100% for development so you see every request
management.tracing.sampling.probability=1.0

# Point to your local Zipkin server
management.tracing.export.zipkin.endpoint=http://zipkin:9411/api/v2/spans